services:
  postgres:
    # pinned to -trixie: the plain `pg17` tag hit a corrupted layer in this
    # host's local Docker image cache (see README) — this tag is otherwise
    # equivalent (same pgvector-on-Postgres-17 image, different base variant)
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5432 already taken on this host by an unrelated project
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379" # 6379 already taken on this host by an unrelated project
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      # FIGURES_DIR (/data/figures) and EXPORTS_DIR (/data/exports) previously
      # had no volume at all — generated chart/illustration PNGs and exported
      # PDFs lived only in the container's own ephemeral filesystem layer, so
      # any container recreation (a config change, `docker compose up -d`
      # picking up a new .env value, etc.) silently wiped every figure ever
      # generated while the DB rows referencing them survived untouched,
      # leaving /figures/{id}/file 404ing for real, previously-working data.
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
  backend_data:
